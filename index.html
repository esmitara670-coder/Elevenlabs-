<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Story AI Voice Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b0b12;
      color: #f1f1f6;
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.4rem;
      background: linear-gradient(90deg, #ff4d6d, #ffb703);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 16px; }
    .card {
      background: #141422;
      border: 1px solid #26263d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: #0d0d17;
      border: 1px solid #2e2e4a;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      margin-bottom: 10px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #ff4d6d; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      background: linear-gradient(135deg, #e63946, #b5179e);
      color: #fff;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #23233b;
      border: 1px solid #38385c;
      margin-top: 6px;
    }
    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: #25253e;
      color: #ffb703;
      font-weight: 600;
    }
    .audio-box {
      margin-top: 10px;
      background: #0d0d17;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #26263d;
      display: none;
    }
    audio { width: 100%; height: 38px; margin-bottom: 6px; }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: #38bdf8;
    }
    .download-link {
      color: #4ade80;
      text-decoration: none;
      font-weight: 600;
      background: #132a1c;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .status { font-size: 0.82rem; color: #f87171; margin-top: 6px; }
    .section-title { font-size: 1.05rem; margin: 18px 0 10px; color: #e2e8f0; }
  </style>
</head>
<body>

  <h1>Anime Voice Studio (Gemini AI)</h1>
  <p class="subtitle">Dark Fantasy & Manhwa Character Dubbing Generator</p>

  <!-- API Key Section -->
  <div class="card">
    <label for="apiKey">Google AI Studio API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />
    <p style="font-size: 0.76rem; color: #94a3b8;">Key tomar browser-ei safe thakbe, bar bar dite hobe na.</p>
  </div>

  <!-- Custom Voice Generator -->
  <div class="card">
    <h3 style="font-size: 0.98rem; margin-bottom: 10px; color: #ffb703;">Custom Dialogue Generator</h3>
    <div class="row">
      <div>
        <label for="customPreset">Character Preset</label>
        <select id="customPreset">
          <option value="hero_calm">Hero (Deep & Calm Narrator - Charon)</option>
          <option value="hero_awakening">Hero Awakening (Cold & Intense - Charon)</option>
          <option value="villain">Royal Villain (Arrogant & Mocking - Fenrir)</option>
          <option value="girl">Popular Girl (Graceful & Confident - Kore)</option>
          <option value="deep_king">Dark Sovereign (Heavy Bass - Orus)</option>
        </select>
      </div>
    </div>
    <label for="customText">Dialogue (Hindi + English)</label>
    <textarea id="customText" rows="3" placeholder="यहाँ अपना dialogue लिखें..."></textarea>
    <button id="customBtn" onclick="generateCustom()">Generate Custom Voice</button>
    <div id="customStatus" class="status"></div>
    <div id="customAudioBox" class="audio-box">
      <audio id="customAudio" controls></audio>
      <div class="meta-row">
        <span id="customDuration">Duration: --</span>
        <a id="customDownload" class="download-link" download="custom_voice.wav">Download WAV</a>
      </div>
    </div>
  </div>

  <!-- Pre-loaded 8 Scenes -->
  <h2 class="section-title">Pre-Loaded Story Scenes (Flow Timing Ready)</h2>
  <div id="scenesContainer"></div>

  <script>
    const PRESETS = {
      hero_calm: {
        voice: "Charon",
        style: "Speak in a deep, calm, mysterious anime protagonist voice with natural Hindi-English pronunciation and dramatic pauses"
      },
      hero_awakening: {
        voice: "Charon",
        style: "Speak in a dark, cold, intimidating, powerful anime awakening tone with deep bass and dramatic intensity"
      },
      villain: {
        voice: "Fenrir",
        style: "Speak in an arrogant, proud, mocking noble villain anime tone, expressive and sharp"
      },
      girl: {
        voice: "Kore",
        style: "Speak in a soft, graceful, confident anime heroine female voice, emotional yet firm"
      },
      deep_king: {
        voice: "Orus",
        style: "Speak in a heavy, authoritative, commanding dark fantasy voice"
      }
    };

    const STORY_SCENES = [
      {
        id: 1,
        title: "Scene 1 — World Intro",
        target: "Flow: 6s",
        preset: "hero_calm",
        text: "इस दुनिया में हर किसी के पास कोई न कोई power है... सिवाए मेरे। सबको लगता है मैं एक 'Powerless' loser हूँ।"
      },
      {
        id: 2,
        title: "Scene 2 — Royal Student Mockery",
        target: "Flow: 8s",
        preset: "villain",
        text: "हाहा! देखो तो, royal academy में एक zero-mana कचरा आ गया! पक्का इसके पास कोई बेकार सी power होगी!"
      },
      {
        id: 3,
        title: "Scene 3 — Popular Girl Reply",
        target: "Flow: 8s",
        preset: "girl",
        text: "बस करो! सिर्फ power किसी की औकात decide नहीं करती। कभी-कभी सबसे शांत इंसान के अंदर ही सबसे बड़ा तूफ़ान होता है।"
      },
      {
        id: 4,
        title: "Scene 4 — Villain Furious",
        target: "Flow: 6s",
        preset: "villain",
        text: "तुम इस loser के लिए मुझसे लड़ोगी?! आज मैं सबके सामने इसकी असलियत दिखाऊँगा!"
      },
      {
        id: 5,
        title: "Scene 5 — S-Rank Attack",
        target: "Flow: 4s",
        preset: "hero_calm",
        text: "उसने अपना S-Rank attack सीधा मुझ पर छोड़ दिया!"
      },
      {
        id: 6,
        title: "Scene 6A — Girl Warning",
        target: "Flow: 8s (Part A)",
        preset: "girl",
        text: "हटो वहाँ से!"
      },
      {
        id: 7,
        title: "Scene 6B — Seal Breaks",
        target: "Flow: 8s (Part B)",
        preset: "hero_calm",
        text: "वो मुझे बचाने आगे बढ़ी... लेकिन तभी मेरे अंदर का seal टूट गया।"
      },
      {
        id: 8,
        title: "Scene 7 — Power Awakening (Climax)",
        target: "Flow: 10s",
        preset: "hero_awakening",
        text: "मैंने अपनी power छुपा कर रखी थी, क्योंकि अगर ये बाहर आई... तो पूरी academy राख हो जाएगी!"
      },
      {
        id: 9,
        title: "Scene 8 — Cliffhanger Ending",
        target: "Flow: 6s",
        preset: "hero_awakening",
        text: "अब तुम्हारी बारी है..."
      }
    ];

    // Load saved API key
    const apiKeyInput = document.getElementById("apiKey");
    try {
      const savedKey = localStorage.getItem("gemini_tts_api_key");
      if (savedKey) apiKeyInput.value = savedKey;
      apiKeyInput.addEventListener("input", () => {
        localStorage.setItem("gemini_tts_api_key", apiKeyInput.value.trim());
      });
    } catch (e) {}

    // Render Scene Cards
    const container = document.getElementById("scenesContainer");
    STORY_SCENES.forEach((s) => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="scene-header">
          <strong style="font-size: 0.92rem; color: #f8fafc;">${s.title}</strong>
          <span class="badge">${s.target}</span>
        </div>
        <select id="preset-${s.id}">
          <option value="hero_calm" ${s.preset === "hero_calm" ? "selected" : ""}>Hero (Deep & Calm - Charon)</option>
          <option value="hero_awakening" ${s.preset === "hero_awakening" ? "selected" : ""}>Hero Awakening (Cold & Intense - Charon)</option>
          <option value="villain" ${s.preset === "villain" ? "selected" : ""}>Royal Villain (Arrogant - Fenrir)</option>
          <option value="girl" ${s.preset === "girl" ? "selected" : ""}>Popular Girl (Graceful - Kore)</option>
          <option value="deep_king" ${s.preset === "deep_king" ? "selected" : ""}>Dark Sovereign (Heavy Bass - Orus)</option>
        </select>
        <textarea id="text-${s.id}" rows="2">${s.text}</textarea>
        <button id="btn-${s.id}" onclick="generateScene(${s.id})">Generate Voice</button>
        <div id="status-${s.id}" class="status"></div>
        <div id="box-${s.id}" class="audio-box">
          <audio id="audio-${s.id}" controls></audio>
          <div class="meta-row">
            <span id="dur-${s.id}">Duration: --</span>
            <a id="dl-${s.id}" class="download-link" download="scene_${s.id}.wav">Download WAV</a>
          </div>
        </div>
      `;
      container.appendChild(div);
    });

    function pcmToWavBlob(base64Data, sampleRate = 24000) {
      const binaryStr = atob(base64Data);
      const pcmLen = binaryStr.length;
      const wavBuffer = new ArrayBuffer(44 + pcmLen);
      const view = new DataView(wavBuffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + pcmLen, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, pcmLen, true);

      const bytes = new Uint8Array(wavBuffer, 44);
      for (let i = 0; i < pcmLen; i++) bytes[i] = binaryStr.charCodeAt(i);

      return new Blob([wavBuffer], { type: "audio/wav" });
    }

    async function callGeminiTTS(apiKey, presetKey, dialogueText) {
      const preset = PRESETS[presetKey];
      const prompt = `${preset.style}: "${dialogueText}"`;

      const models = ["gemini-2.5-flash-preview-tts", "gemini-2.5-flash"];
      let lastError = "";

      for (const model of models) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: preset.voice
                }
              }
            }
          }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          lastError = data?.error?.message || `HTTP ${res.status}`;
          continue;
        }

        const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
        if (part && part.inlineData?.data) {
          const mime = part.inlineData.mimeType || "";
          if (mime.includes("wav") || mime.includes("mp3") || mime.includes("ogg")) {
            const bin = atob(part.inlineData.data);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type: mime });
          } else {
            const rateMatch = mime.match(/rate=(\d+)/);
            const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
            return pcmToWavBlob(part.inlineData.data, sampleRate);
          }
        }
        lastError = "No audio returned from model.";
      }
      throw new Error(lastError);
    }

    async function runGeneration(btnEl, statusEl, boxEl, audioEl, durEl, dlEl, presetKey, text) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        statusEl.textContent = "Prothome upore Google AI Studio API Key dao!";
        return;
      }
      if (!text.trim()) {
        statusEl.textContent = "Dialogue khali rakha jabe na!";
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = "Generating...";
      statusEl.textContent = "";

      try {
        const blob = await callGeminiTTS(apiKey, presetKey, text.trim());
        const url = URL.createObjectURL(blob);
        audioEl.src = url;
        dlEl.href = url;
        boxEl.style.display = "block";

        audioEl.onloadedmetadata = () => {
          durEl.textContent = `Exact Duration: ${audioEl.duration.toFixed(1)}s`;
        };
        audioEl.play().catch(() => {});
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        btnEl.disabled = false;
        btnEl.textContent = "Generate Voice";
      }
    }

    function generateScene(id) {
      runGeneration(
        document.getElementById(`btn-${id}`),
        document.getElementById(`status-${id}`),
        document.getElementById(`box-${id}`),
        document.getElementById(`audio-${id}`),
        document.getElementById(`dur-${id}`),
        document.getElementById(`dl-${id}`),
        document.getElementById(`preset-${id}`).value,
        document.getElementById(`text-${id}`).value
      );
    }

    function generateCustom() {
      runGeneration(
        document.getElementById("customBtn"),
        document.getElementById("customStatus"),
        document.getElementById("customAudioBox"),
        document.getElementById("customAudio"),
        document.getElementById("customDuration"),
        document.getElementById("customDownload"),
        document.getElementById("customPreset").value,
        document.getElementById("customText").value
      );
    }
  </script>
</body>
          </html>
