<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Voice Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0b12; color: #f1f1f7; padding: 16px; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: 14px; color: #c084fc; text-align: center; }

    .api-box {
      background: #151524; border: 1px solid #2a2a42; border-radius: 12px;
      padding: 12px; margin-bottom: 18px;
    }
    .api-box label { display: block; font-size: 0.85rem; color: #a1a1bc; margin-bottom: 6px; }
    .api-box input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #353554;
      background: #0d0d17; color: #fff; font-size: 0.9rem;
    }

    .card {
      background: #151524; border: 1px solid #2a2a42; border-radius: 14px;
      padding: 14px; margin-bottom: 16px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .char-name {
      font-size: 1.05rem; font-weight: 700; background: transparent; border: none;
      color: #fff; width: 50%; outline: none; border-bottom: 1px dashed #3a3a5c; padding-bottom: 2px;
    }
    .hero-accent { border-left: 4px solid #a855f7; }
    .heroine-accent { border-left: 4px solid #38bdf8; }
    .villain-accent { border-left: 4px solid #ef4444; }
    .extra-accent { border-left: 4px solid #f59e0b; }

    select, input[type="text"], textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #32324f;
      background: #0d0d17; color: #f5f5fa; font-size: 0.9rem; margin-bottom: 10px;
    }
    select { width: auto; margin-bottom: 0; font-size: 0.85rem; padding: 6px 8px; }
    textarea { min-height: 84px; resize: vertical; line-height: 1.4; }

    .label-sm { display: block; font-size: 0.78rem; color: #9c9cb8; margin-bottom: 4px; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-gen { background: #7c3aed; color: #fff; flex: 1; }
    .btn-dl { background: #10b981; color: #052e16; display: none; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
    .btn-del { background: #3f1d28; color: #fca5a5; padding: 6px 10px; font-size: 0.78rem; }
    .btn-add {
      width: 100%; background: #1e1e33; color: #c084fc; border: 1px dashed #7c3aed;
      padding: 12px; margin-top: 4px;
    }

    audio { width: 100%; margin-top: 10px; display: none; height: 38px; }
    .status { font-size: 0.8rem; color: #a1a1bc; margin-top: 8px; min-height: 16px; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <h1>🎙️ Anime Voice Studio</h1>

  <div class="api-box">
    <label for="apiKey">Google AI Studio API Key (Auto-saved in browser)</label>
    <input type="password" id="apiKey" placeholder="Paste your AIza... API key here" />
  </div>

  <div id="voiceList"></div>

  <button class="btn-add" id="addExtraBtn">+ Add Extra Character (System / Boss / Side)</button>

  <script>
    const MODEL = "gemini-2.5-flash-preview-tts";

    const VOICE_OPTIONS = [
      { id: "Charon", label: "Charon (Deep / Cold Male)" },
      { id: "Fenrir", label: "Fenrir (Intense / Strong Male)" },
      { id: "Orus", label: "Orus (Firm / Heavy Male)" },
      { id: "Algenib", label: "Algenib (Gravelly / Villain Male)" },
      { id: "Puck", label: "Puck (Young / Expressive Male)" },
      { id: "Enceladus", label: "Enceladus (Breathy / Mysterious Male)" },
      { id: "Kore", label: "Kore (Emotional / Clear Female)" },
      { id: "Aoede", label: "Aoede (Soft / Expressive Female)" },
      { id: "Zephyr", label: "Zephyr (Bright / Young Female)" },
      { id: "Leda", label: "Leda (Youthful Female)" }
    ];

    const DEFAULT_CHARACTERS = [
      {
        id: "hero",
        name: "Hero",
        accent: "hero-accent",
        voice: "Charon",
        style: "Speak in a calm, deep, intense young male anime protagonist voice in clear Hindi:",
        locked: true
      },
      {
        id: "heroine",
        name: "Heroine",
        accent: "heroine-accent",
        voice: "Kore",
        style: "Speak in an emotional, expressive young female anime voice in clear Hindi:",
        locked: true
      },
      {
        id: "villain",
        name: "Villain",
        accent: "villain-accent",
        voice: "Algenib",
        style: "Speak in a cold, arrogant, mocking deep male anime villain voice in clear Hindi:",
        locked: true
      }
    ];

    const apiKeyInput = document.getElementById("apiKey");
    apiKeyInput.value = localStorage.getItem("gemini_tts_api_key") || "";
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("gemini_tts_api_key", apiKeyInput.value.trim());
    });

    function loadSavedPrefs() {
      try {
        return JSON.parse(localStorage.getItem("anime_voice_prefs") || "{}");
      } catch {
        return {};
      }
    }

    function savePref(id, field, value) {
      const prefs = loadSavedPrefs();
      if (!prefs[id]) prefs[id] = {};
      prefs[id][field] = value;
      localStorage.setItem("anime_voice_prefs", JSON.stringify(prefs));
    }

    function base64ToUint8Array(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function pcmToWavBlob(pcmBytes, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
      const blockAlign = numChannels * (bitsPerSample / 8);
      const buffer = new ArrayBuffer(44 + pcmBytes.length);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + pcmBytes.length, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeStr(36, "data");
      view.setUint32(40, pcmBytes.length, true);

      new Uint8Array(buffer, 44).set(pcmBytes);
      return new Blob([buffer], { type: "audio/wav" });
    }

    function createVoiceCard(char) {
      const prefs = loadSavedPrefs()[char.id] || {};
      const selectedVoice = prefs.voice || char.voice;
      const savedStyle = prefs.style ?? char.style;

      const card = document.createElement("div");
      card.className = `card ${char.accent}`;

      const optionsHtml = VOICE_OPTIONS.map(
        (v) => `<option value="${v.id}" ${v.id === selectedVoice ? "selected" : ""}>${v.label}</option>`
      ).join("");

      card.innerHTML = `
        <div class="card-header">
          <input class="char-name" type="text" value="${char.name}" />
          <div style="display:flex; gap:6px; align-items:center;">
            <select class="voice-select">${optionsHtml}</select>
            ${char.locked ? "" : '<button class="btn-del" title="Remove">✕</button>'}
          </div>
        </div>
        <label class="label-sm">Tone / Emotion Direction (Optional)</label>
        <input class="style-input" type="text" value="${savedStyle}" />
        <label class="label-sm">Dialogue Text</label>
        <textarea class="text-input" placeholder="Paste ${char.name} dialogue here..."></textarea>
        <div class="btn-row">
          <button class="btn-gen">Generate Audio</button>
          <a class="btn-dl" download>⬇ Download WAV</a>
        </div>
        <audio controls></audio>
        <div class="status"></div>
      `;

      const nameEl = card.querySelector(".char-name");
      const voiceEl = card.querySelector(".voice-select");
      const styleEl = card.querySelector(".style-input");
      const textEl = card.querySelector(".text-input");
      const genBtn = card.querySelector(".btn-gen");
      const dlLink = card.querySelector(".btn-dl");
      const audioEl = card.querySelector("audio");
      const statusEl = card.querySelector(".status");
      const delBtn = card.querySelector(".btn-del");

      voiceEl.addEventListener("change", () => savePref(char.id, "voice", voiceEl.value));
      styleEl.addEventListener("input", () => savePref(char.id, "style", styleEl.value));
      if (delBtn) delBtn.addEventListener("click", () => card.remove());

      genBtn.addEventListener("click", async () => {
        const apiKey = apiKeyInput.value.trim();
        const dialogue = textEl.value.trim();
        if (!apiKey) {
          statusEl.textContent = "Age Google AI Studio API key paste koro!";
          statusEl.className = "status err";
          return;
        }
        if (!dialogue) {
          statusEl.textContent = "Dialogue box khali ache!";
          statusEl.className = "status err";
          return;
        }

        genBtn.disabled = true;
        statusEl.textContent = "Generating voice...";
        statusEl.className = "status";
        dlLink.style.display = "none";

        const promptText = styleEl.value.trim()
          ? `${styleEl.value.trim()}\n"${dialogue}"`
          : dialogue;

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: voiceEl.value }
                    }
                  }
                }
              })
            }
          );

          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || "API Error");

          const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
          if (!inlineData?.data) throw new Error("Audio data pawa jayni.");

          const bytes = base64ToUint8Array(inlineData.data);
          const mime = inlineData.mimeType || "audio/L16;rate=24000";
          let blob;

          if (mime.includes("L16") || mime.includes("pcm")) {
            const rateMatch = mime.match(/rate=(\d+)/);
            const rate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
            blob = pcmToWavBlob(bytes, rate);
          } else {
            blob = new Blob([bytes], { type: mime });
          }

          const url = URL.createObjectURL(blob);
          audioEl.src = url;
          audioEl.style.display = "block";
          audioEl.play().catch(() => {});

          const safeName = (nameEl.value.trim() || "voice").toLowerCase().replace(/\s+/g, "_");
          dlLink.href = url;
          dlLink.download = `${safeName}_${Date.now()}.wav`;
          dlLink.style.display = "inline-block";

          statusEl.textContent = `Done! (${voiceEl.value})`;
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
          statusEl.className = "status err";
        } finally {
          genBtn.disabled = false;
        }
      });

      return card;
    }

    const listEl = document.getElementById("voiceList");
    DEFAULT_CHARACTERS.forEach((c) => listEl.appendChild(createVoiceCard(c)));

    let extraCount = 1;
    document.getElementById("addExtraBtn").addEventListener("click", () => {
      listEl.appendChild(
        createVoiceCard({
          id: `extra_${extraCount}`,
          name: `Extra Character ${extraCount}`,
          accent: "extra-accent",
          voice: "Orus",
          style: "Speak in a deep, echoing robotic system voice in English:",
          locked: false
        })
      );
      extraCount++;
    });
  </script>
</body>
</html>
